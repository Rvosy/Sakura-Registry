name: Review plugin submission

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  review:
    if: >-
      !github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/approve ') ||
      github.event.comment.body == '/reject' || startsWith(github.event.comment.body, '/reject '))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: submission-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/submission.py moderate
