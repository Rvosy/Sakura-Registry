name: Check plugin submission

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  check:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.body, '### 插件 ID') &&
      (github.event_name == 'issues' || github.event.comment.body == '/recheck')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: submission-check-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Resolve and check the submitted version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/submission.py check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: submission
          path: .local/submission/
          include-hidden-files: true
          retention-days: 30

  report:
    needs: check
    if: always() && needs.check.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: submission
          path: .local/submission/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/submission.py report
