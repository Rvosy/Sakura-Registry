name: 插件投稿或新版
description: 自动校验插件，维护者批准后生成收录 PR。
title: "[插件投稿] "
body:
  - type: input
    id: plugin_id
    attributes:
      label: 插件 ID
      placeholder: 与 plugin.yaml 中的 id 一致
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: GitHub 仓库
      placeholder: https://github.com/your-name/your-plugin
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 要收录的版本
      description: 可填 Release 链接、Tag 或 commit；留空取最新正式 Release，没有 Release 则取默认分支。
      placeholder: v1.0.0
  - type: textarea
    id: notes
    attributes:
      label: 补充说明
      description: 可填写插件用途、版本变化或已验证的运行环境。
