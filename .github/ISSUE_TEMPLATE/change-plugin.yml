name: 撤回或恢复版本
description: 自动检查收录状态，维护者批准后生成变更 PR。
title: "[收录变更] "
body:
  - type: input
    id: plugin_id
    attributes:
      label: 插件 ID
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: 操作
      options:
        - 撤回版本
        - 恢复版本
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本号
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 原因或说明
    validations:
      required: true
